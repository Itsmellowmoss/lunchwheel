<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f5eb">
    <title>Lunch Wheel</title>
    <link rel="stylesheet" href="styles.css?v=28">
    <script src="restaurants.js?v=20" defer></script>
    <script src="app.js?v=54" defer></script>
</head>
<body>
    <main>
        <header class="page-header">
            <h1>Good lunch.<br><span>Zero deciding.</span></h1>
            <p class="subtitle">Well, maybe a bit of deciding.</p>
        </header>

        <div class="layout">
            <section class="wheel-area" aria-label="Lunch picker wheel">
                <div class="wheel-frame">
                    <div class="pointer" aria-hidden="true"></div>
                    <div class="wheel-ticker" id="wheel-ticker" aria-hidden="true" hidden></div>
                    <canvas id="wheel" role="img" aria-label="Wheel of nearby restaurants"></canvas>
                    <div class="wheel-tooltip" id="wheel-tooltip" role="status" hidden></div>
                    <button class="wheel-hub" id="spin" type="button" disabled aria-label="Spin the wheel"><span>LET'S</span><strong>SPIN</strong></button>
                    <div class="wheel-empty" id="wheel-empty" role="status" aria-live="polite" hidden>
                        <strong id="wheel-empty-title"></strong>
                        <span id="wheel-empty-message"></span>
                        <button class="clear-filters-button" id="clear-wheel-filters" type="button" hidden>Clear filters</button>
                    </div>
                </div>
                <p class="result" id="result" aria-live="polite"></p>
                <div class="winner-details" id="winner-details"></div>
            </section>

            <section class="options-panel" aria-labelledby="places-title">
                <div class="panel-heading">
                    <div>
                        <h2 id="places-title">Around the corner</h2>
                    </div>
                    <span class="count-pill" id="option-count">Loading…</span>
                </div>

                <section class="filters" aria-labelledby="filters-title">
                    <div class="filters-heading">
                        <h3 id="filters-title">Find your kind of lunch</h3>
                    </div>
                    <label class="search-label" for="place-search"><span class="visually-hidden">Search by name, address, or cuisine</span>
                        <input id="place-search" type="search" placeholder="Try sushi, pizza, or a name…" autocomplete="off">
                    </label>
                    <div class="filter-fields filter-single">
                        <div class="category-filter">
                            <span class="filter-field-label">Place type</span>
                            <details id="category-filter-menu">
                                <summary id="category-filter-summary">All types</summary>
                                <div class="category-filter-options" role="group" aria-label="Filter by place type">
                                    <label><input name="filter-category" type="checkbox" value="Restaurant"> Restaurants</label>
                                    <label><input name="filter-category" type="checkbox" value="Cafe"> Cafes</label>
                                    <label><input name="filter-category" type="checkbox" value="Fast food"> Fast food</label>
                                    <label><input name="filter-category" type="checkbox" value="Bakery"> Bakeries</label>
                                    <label><input name="filter-category" type="checkbox" value="Sandwich shop"> Sandwich shops</label>
                                    <label><input name="filter-category" type="checkbox" value="Takeaway"> Takeaway</label>
                                    <label><input name="filter-category" type="checkbox" value="Brunch"> Brunch</label>
                                </div>
                            </details>
                        </div>
                    </div>
                    <div class="filter-options">
                        <label class="filter-check">
                            <input id="filter-closed" type="checkbox" checked>
                            Include closed places on the wheel
                        </label>
                        <label class="filter-check">
                            <input id="filter-unpriced" type="checkbox" checked>
                            Show and spin places without confirmed prices
                        </label>
                        <label class="filter-check">
                            <input id="filter-vegetarian" type="checkbox">
                            Has vegetarian options
                        </label>
                    </div>
                    <div class="filter-fields">
                        <label>
                            Max walking time
                            <select id="filter-walk">
                                <option value="">Any</option>
                                <option value="2">2 min</option>
                                <option value="3">3 min</option>
                                <option value="4">4 min</option>
                                <option value="5">5 min</option>
                                <option value="6">6 min</option>
                                <option value="7">7 min</option>
                                <option value="8">8 min</option>
                                <option value="10">10 min</option>
                                <option value="12">12 min</option>
                                <option value="15">15 min</option>
                                <option value="20">20 min</option>
                            </select>
                        </label>
                        <label>
                            Max lunch price
                            <select id="filter-price">
                                <option value="">Any</option>
                                <option value="60">60 kr</option>
                                <option value="80">80 kr</option>
                                <option value="100">100 kr</option>
                                <option value="120">120 kr</option>
                                <option value="150">150 kr</option>
                            </select>
                        </label>
                    </div>
                </section>

                <div class="list-heading">
                    <span>Lunch spots</span>
                </div>
                <ul class="option-list" id="option-list" aria-label="Nearby places for lunch"></ul>

                <details class="add-section">
                    <summary id="add-title"><span class="add-icon" aria-hidden="true">+</span><span>Add a lunch spot</span></summary>
                    <div class="add-content">
                    <form id="add-form">
                        <label>
                            Google Maps link
                            <input id="new-map-link" type="url" placeholder="https://maps.google.com/…" autocomplete="url">
                        </label>
                        <div class="form-grid">
                            <label>
                                Place name
                                <input id="new-name" type="text" maxlength="60" placeholder="Place name" required>
                            </label>
                            <label>
                                Address
                                <input id="new-address" type="text" maxlength="100" placeholder="Street address, Stockholm">
                            </label>
                            <label>
                                Walking time (minutes)
                                <input id="new-walk" type="number" min="1" max="120" placeholder="e.g. 10">
                            </label>
                            <label>
                                Place type
                                <select id="new-category">
                                    <option value="Restaurant">Restaurant</option>
                                    <option value="Cafe">Cafe</option>
                                    <option value="Fast food">Fast food</option>
                                    <option value="Bakery">Bakery</option>
                                    <option value="Sandwich shop">Sandwich shop</option>
                                    <option value="Takeaway">Takeaway</option>
                                    <option value="Brunch">Brunch</option>
                                </select>
                            </label>
                            <label>
                                Usual lunch price (kr)
                                <input id="new-price" type="number" min="0" max="5000" placeholder="e.g. 145">
                            </label>
                            <label>
                                Vegetarian options
                                <select id="new-vegetarian">
                                    <option value="unknown">Not sure</option>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </label>
                        </div>
                        <label>
                            Weekly opening hours (optional)
                            <textarea id="new-hours" rows="3" placeholder="Mon-Fri 11:00-21:00; Sat 12:00-22:00; Sun closed"></textarea>
                        </label>
                        <button class="add-button" type="submit">Add place</button>
                        <p class="form-message" id="form-message" aria-live="polite"></p>
                    </form>
                    </div>
                </details>
            </section>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </main>
</body>
</html>
